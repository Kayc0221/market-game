<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="d.title">課堂看板 · 華爾街預言家</title>
  <meta name="description" content="16 週股市預測挑戰：每週結算結果、全班靶心、前三名與排行榜。 · Class dashboard for the 16-week market prediction challenge.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body class="dash">
  <header class="dash-bar">
    <div class="dash-brand"><span aria-hidden="true">🎯</span> <span data-i18n="app.name">華爾街預言家</span> <span class="muted">· <span data-i18n="d.brand">課堂看板</span></span></div>
    <nav class="week-nav" data-i18n-aria="d.weekNav">
      <button class="icon-btn" id="prev-week" data-i18n-aria="d.prev">‹</button>
      <select id="week-select" data-i18n-aria="d.select"></select>
      <button class="icon-btn" id="next-week" data-i18n-aria="d.next">›</button>
    </nav>
    <div class="dash-actions">
      <span class="muted small" id="updated"></span>
      <div class="lang-toggle on-dark"></div>
      <button class="icon-btn" id="refresh" data-i18n-aria="d.refresh" data-i18n-title="d.refresh">↻</button>
      <button class="icon-btn" id="theme" data-i18n-aria="d.theme" data-i18n-title="d.theme">◐</button>
      <button class="icon-btn" id="fullscreen" data-i18n-aria="d.fullscreen" data-i18n-title="d.fullscreen">⛶</button>
    </div>
  </header>

  <main class="dash-main" id="dash" hidden>
    <section class="dash-hero" id="hero"></section>

    <section class="dash-row two">
      <article class="card">
        <div class="card-head">
          <h2 id="target-title"></h2>
          <label class="toggle"><input type="checkbox" id="show-names"> <span data-i18n="d.showNames"></span></label>
        </div>
        <p class="muted small" id="target-note"></p>
        <div class="target-wrap dash-target" id="class-target"></div>
      </article>
      <article class="card">
        <div class="card-head"><h2 id="podium-title"></h2></div>
        <div id="podium" class="dash-podium"></div>
      </article>
    </section>

    <section class="dash-row two">
      <article class="card">
        <div class="card-head">
          <h2 id="board-title"></h2>
          <span class="muted small" data-i18n="d.boardNote"></span>
        </div>
        <ol class="dash-board" id="board"></ol>
      </article>
      <article class="card open-card" id="open-card"></article>
    </section>

    <section class="dash-row two">
      <article class="card">
        <div class="card-head">
          <h2 id="asset-title"></h2>
          <span class="muted small" data-i18n="d.assetsNote"></span>
        </div>
        <ol class="dash-board" id="asset-board"></ol>
      </article>
      <article class="card" id="invest-card"></article>
    </section>
  </main>

  <div class="dash-msg" id="msg" data-i18n="d.loading">載入中…</div>
  <div class="tip" id="tip" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="demo.js"></script>
  <script src="common.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
