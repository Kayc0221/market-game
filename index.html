<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="app.name">華爾街預言家</title>
  <meta name="description" content="16 週股市預測挑戰：預測 S&P 500 與 NASDAQ 每週漲跌，看誰最準。 · 16-week market prediction challenge for the S&P 500 and NASDAQ.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 登入 -->
  <main id="login" class="login" hidden>
    <div class="login-card">
      <div class="lang-toggle login-lang"></div>
      <div class="login-emoji" aria-hidden="true">🎯</div>
      <h1 data-i18n="app.name">華爾街預言家</h1>
      <p class="muted" data-i18n="login.tagline"></p>
      <form id="login-form" autocomplete="off">
        <label for="sid" data-i18n="login.sid">學號</label>
        <input id="sid" name="sid" inputmode="text" data-i18n-ph="login.sidPh" required autofocus>
        <label class="remember"><input type="checkbox" id="remember" checked> <span data-i18n="login.remember"></span></label>
        <button type="submit" class="btn primary" id="login-btn" data-i18n="login.go">開始挑戰</button>
        <p class="error" id="login-error" role="alert"></p>
      </form>
      <p class="demo-hint" id="demo-hint" hidden data-i18n="login.demo"></p>
    </div>
  </main>

  <!-- 主畫面 -->
  <div id="app" hidden>
    <header class="hero">
      <div class="hero-inner">
        <div class="who">
          <div class="avatar" id="avatar" aria-hidden="true"></div>
          <div>
            <div class="who-name" id="who-name"></div>
            <div class="who-sub" id="who-sub"></div>
          </div>
        </div>
        <div class="level">
          <div class="level-row"><span class="level-name" id="level-name"></span><span class="level-xp" id="level-xp"></span></div>
          <div class="xpbar" role="progressbar" data-i18n-aria="xp" id="xpbar"><span id="xpfill"></span></div>
        </div>
        <div class="hero-actions">
          <div class="lang-toggle on-dark"></div>
          <button class="btn ghost small" id="logout" data-i18n="logout">登出</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="grid-top">
        <article class="card mission" id="mission"></article>
        <div class="tiles" id="tiles"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2 id="podium-title"></h2>
          <span class="muted small" data-i18n="podium.sub"></span>
        </div>
        <div id="podium"></div>
      </section>

      <section class="card" id="portfolio-card" hidden>
        <div class="card-head">
          <h2 data-i18n="pf.title"></h2>
          <span class="muted small" data-i18n="pf.sub"></span>
        </div>
        <div class="pf-top">
          <div class="pf-hero">
            <div class="tile-label" data-i18n="pf.total"></div>
            <div class="pf-value" id="pf-equity"></div>
            <div class="pf-ret" id="pf-ret"></div>
          </div>
          <div class="pf-stats" id="pf-stats"></div>
        </div>
        <div class="legend pf-legend">
          <span><i class="key line s2"></i><span data-i18n="pf.mine"></span></span>
          <span><i class="key line s1"></i><span data-i18n="pf.bhSpx"></span></span>
          <span><i class="key line s3"></i><span data-i18n="pf.bhIxic"></span></span>
        </div>
        <div class="chart-box"><canvas id="chart-assets"></canvas></div>
        <details class="pf-details">
          <summary data-i18n="pf.details"></summary>
          <div class="table-scroll">
            <table class="records">
              <thead><tr id="pf-head"></tr></thead>
              <tbody id="pf-rows"></tbody>
            </table>
          </div>
        </details>
      </section>

      <section class="card">
        <div class="card-head">
          <h2 data-i18n="chart.title"></h2>
          <div class="legend">
            <span><i class="key line s1"></i><span data-i18n="chart.actual"></span></span>
            <span><i class="key dot s2"></i><span data-i18n="chart.mine"></span></span>
          </div>
        </div>
        <div class="multiples">
          <figure><figcaption data-i18n="chart.spx"></figcaption><div class="chart-box"><canvas id="chart-spx"></canvas></div></figure>
          <figure><figcaption data-i18n="chart.ixic"></figcaption><div class="chart-box"><canvas id="chart-ixic"></canvas></div></figure>
        </div>
      </section>

      <section class="grid-two">
        <article class="card">
          <div class="card-head">
            <h2 data-i18n="my.target"></h2>
          </div>
          <p class="muted small" data-i18n="my.targetNote"></p>
          <div class="target-wrap" id="target"></div>
        </article>
        <article class="card">
          <div class="card-head">
            <h2 data-i18n="rank.title"></h2>
          </div>
          <p class="muted small" data-i18n="rank.note"></p>
          <div class="chart-box tall"><canvas id="chart-rank"></canvas></div>
        </article>
      </section>

      <section class="grid-two">
        <article class="card">
          <div class="card-head">
            <h2 data-i18n="board.title"></h2>
            <div class="tabs" role="tablist" id="board-tabs">
              <button role="tab" data-scope="1">R1</button>
              <button role="tab" data-scope="2">R2</button>
              <button role="tab" data-scope="all" data-i18n="board.all"></button>
              <button role="tab" data-scope="assets" data-i18n="board.assets"></button>
            </div>
          </div>
          <ol class="board" id="board"></ol>
          <p class="muted small" id="board-note"></p>
        </article>
        <article class="card">
          <div class="card-head">
            <h2 data-i18n="badges.title"></h2>
            <span class="muted small" id="badge-count"></span>
          </div>
          <ul class="badges" id="badges"></ul>
        </article>
      </section>

      <section class="card">
        <div class="card-head"><h2 data-i18n="rec.title"></h2></div>
        <div class="table-scroll">
          <table class="records">
            <thead><tr id="rec-head"></tr></thead>
            <tbody id="records"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div class="loading" id="loading" hidden><div class="spinner"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="tip" id="tip" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="demo.js"></script>
  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
